// libadb-android 3.1.1 (https://github.com/MuntashirAkon/libadb-android, commit c849886), kept here
// with fixes - see README.md. Used under Apache-2.0 (see COPYING and LICENSES/).
plugins {
    id "com.android.library"
}

android {
    namespace "io.github.muntashirakon.adb"
    compileSdk 35

    defaultConfig {
        minSdk 26                               // (upstream: 1; this app needs 26)
        targetSdk 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true    // android.util.Log etc. are no-ops in JVM tests
    }
    lint { checkReleaseBuilds false }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.bouncycastle:bcprov-jdk15to18:1.81"
    implementation "com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1"

    testImplementation "junit:junit:4.13.2"
}
