pluginManagement {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central, Google's mirror
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {   // Chaquopy's Gradle plugin is on Maven Central as com.chaquo.python:gradle
            if (requested.id.id == "com.chaquo.python") useModule("com.chaquo.python:gradle:${requested.version}")
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central, Google's mirror
        mavenCentral()
        maven { url "https://jitpack.io" }      // libadb-android (adb client inside the app)
    }
}
rootProject.name = "ArrowBot"
include ":app", ":libadb"
