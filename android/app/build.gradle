// The ArrowBot app: the accessibility + screen-capture helper with the bot itself inside (Python via
// Chaquopy, with numpy and OpenCV). The bot's code comes from ../../src (the same files ArrowBot.py
// packs), copied into the app's assets at build time.
//   ANDROID_HOME=... ./gradlew -PbuildPython=/path/to/python3.10 :app:assembleRelease   (or: python build_app.py)
plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.arrowbot.helper"
    compileSdk 35

    defaultConfig {
        applicationId "com.arrowbot.helper"     // same app as the helper: installs over it
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "3.0"
        ndk { abiFilters "arm64-v8a" }          // 64-bit ARM phones (Pixel 6 and newer, ...)
    }

    signingConfigs {
        release {
            storeFile file("helper.keystore")   // the helper's key: updates install over the old app
            storePassword "arrowbot"
            keyAlias "helper"
            keyPassword "arrowbot"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main { assets.srcDirs += "$buildDir/botassets" }
    }
    lint { checkReleaseBuilds false }
}

chaquopy {
    defaultConfig {
        version = "3.10"                        // the newest Python with an Android OpenCV build
        if (project.hasProperty("buildPython")) buildPython(project.property("buildPython"))
        pip {
            install "numpy==1.26.2"
            install "opencv-python==4.5.1.48"
        }
    }
}

dependencies {
    // adb inside the app, to this phone's own Wireless debugging (pairing, shell, scrcpy's server)
    implementation project(":libadb")             // libadb-android 3.1.1 with fixes (../libadb)
    implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"   // the app's adb certificate
    // pairing needs TLS keying material export: Android's own Conscrypt is a hidden API
    implementation "org.conscrypt:conscrypt-android:2.5.2"
}

// the bot: bot.py, onphone.py, bridge.py + its templates, and scrcpy's server (started over adb
// when Wireless debugging is available; not the PC launcher or scrcpy's Windows files)
def copyBot = tasks.register("copyBot", Copy) {
    from("$rootDir/../src") {
        include "bot.py", "onphone.py", "bridge.py", "buttons/**", "ingame/**", "Scrcpy/scrcpy-server"
    }
    into "$buildDir/botassets/bot"
}
preBuild.dependsOn(copyBot)
